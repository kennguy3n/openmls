[package]
name = "openmls_libcrux_crypto"
version = "0.3.1"
edition = "2021"
authors = ["OpenMLS Authors"]
description = "A crypto backend for OpenMLS based on libcrux implementing openmls_traits."
license = "MIT"
documentation = "https://docs.rs/openmls_libcrux_crypto"
repository = "https://github.com/openmls/openmls/tree/main/openmls_libcrux_crypto"
readme = "../README.md"

[dependencies]
libcrux-aead = { version = "0.0.7" }
libcrux-ed25519 = { version = "0.0.7", features = ["rand"] }
libcrux-hkdf = { version = "0.0.6" }
libcrux-sha2 = { version = "0.0.6" }
libcrux-hmac = { version = "0.0.6" }
libcrux-ml-dsa = { version = "0.0.8", optional = true }
libcrux-traits = { version = "0.0.6" }

openmls_traits = { workspace = true }
openmls_memory_storage = { workspace = true }

rand = "0.9"
tls_codec.workspace = true
rand_chacha = "0.9"

hpke-rs = { version = "0.6.1", features = ["hazmat", "serialization"] }
hpke-rs-crypto = { version = "0.6.1" }
hpke-rs-libcrux = { version = "0.6.1" }

[features]
# Enable the X-Wing draft-06 hybrid KEM ciphersuite
# (`MLS_256_XWING_CHACHA20POLY1305_SHA256_Ed25519`, draft codepoint 0x004D).
#
# The X-Wing combiner is still an IETF/CFRG draft and uses a draft codepoint
# that will change once IANA assigns a final value, so it is gated behind an
# explicit feature flag to make sure it cannot be selected accidentally in
# production builds.
xwing = []

# Enable the ML-DSA-65 signature scheme (FIPS 204) in this provider.
#
# `SignatureScheme::MLDSA65` (codepoint `0x0905`, draft) is gated behind
# this feature flag because the codepoint itself is in the IETF draft /
# private-use range and the runtime size of ML-DSA-65 keys and signatures
# is materially larger than classical Ed25519 (1952-byte verification key,
# 4032-byte signing key, 3309-byte signature). Builds that do not set
# `mldsa` continue to reject ML-DSA in `signature_key_gen` / `sign` /
# `verify_signature` with `UnsupportedSignatureScheme`, exactly like the
# RustCrypto provider.
mldsa = ["dep:libcrux-ml-dsa"]
# Enable the ML-DSA-44 signature scheme (FIPS 204).
#
# Same caveats as `mldsa`. Codepoint `0x0904` (draft / private-use). The
# `mldsa44` feature is independent of `mldsa` so consumers can pick
# exactly the parameter set their device supports.
mldsa44 = ["dep:libcrux-ml-dsa"]
# Enable the ML-DSA-87 signature scheme (FIPS 204).
#
# Same caveats as `mldsa`. Codepoint `0x0906` (draft / private-use).
mldsa87 = ["dep:libcrux-ml-dsa"]

extensions-draft-08 = [
    "openmls_traits/extensions-draft-08",
    "openmls_memory_storage/extensions-draft-08",
]
